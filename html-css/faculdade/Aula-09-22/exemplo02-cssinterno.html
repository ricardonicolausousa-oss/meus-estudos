<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de Classes em HTML</title>

    <style>
        .titulo-principal {
            color: darkblue;
            text-align: center;
        }

        .caixa01{
            background-color: lightsteelblue;
            border: 2px solid darkblue;
            padding: 20px;
            margin: 20px;
        }

        .caixa02{
            background-color: lightgreen;
            border: 2px solid darkgreen;
            padding: 20px;
            margin: 20px;
        }

        .paragrafo01{
            color: red;
            font-weight: bold;
        }

        .paragrafo02{
            color: pink; 
            background-color: yellow;
            font-style: italic;
            padding: 10px; 
        }

    </style>

</head>
<body>
    <main>
        <h1 class="titulo-principal">Meu Título Principal</h1>

        <div class="caixa01">
            <p class="paragrafo01">Este é o primeiro parágrafo dentro do primeiro bloco.</p>
            <p class="paragrafo02">Este é o segundo parágrafo dentro do primeiro bloco.</p>
        </div>

        <div class="caixa02">
            <p class="texto-rodape">Este é o parágrafo único do segundo bloco.</p>
        </div>
    </main>
</body>
</html>
